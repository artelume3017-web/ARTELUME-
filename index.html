    <script>
      // Gracefully mock Vite HMR WebSocket in container preview where HMR WebSockets are not routed
      (function() {
        var RealWebSocket = window.WebSocket;
        if (!RealWebSocket) return;
        window.WebSocket = function(url, protocols) {
          var urlStr = String(url || '');
          var protoStr = typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols.join(',') : '');
          var isVite = protoStr.includes('vite') || urlStr.includes('vite') || urlStr.includes('token=');
          if (isVite) {
            var target = new EventTarget();
            var mockWs = {
              url: urlStr,
              protocol: typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] : ''),
              readyState: 0,
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              send: function() {},
              close: function() { this.readyState = 3; },
              addEventListener: function(type, listener, options) { target.addEventListener(type, listener, options); },
              removeEventListener: function(type, listener, options) { target.removeEventListener(type, listener, options); },
              dispatchEvent: function(event) { return target.dispatchEvent(event); }
            };
            setTimeout(function() {
              mockWs.readyState = 1;
              target.dispatchEvent(new Event('open'));
            }, 0);
            return mockWs;
          }
          return new RealWebSocket(url, protocols);
        };
        window.WebSocket.prototype = RealWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        // Catch & prevent default for any stray WebSocket / vite preview errors
        window.addEventListener('error', function(event) {
          var msg = event && event.message ? event.message : '';
          if (msg.includes('WebSocket') || msg.includes('[vite]')) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason ? (event.reason.message || String(event.reason)) : '';
          if (reason.includes('WebSocket') || reason.includes('[vite]')) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
